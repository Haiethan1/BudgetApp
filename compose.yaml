services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: /data/homebooks.sqlite
      BACKUP_DIR: /backups
    ports:
      - "${HOMEBOOKS_PORT:-3000}:3000"
    volumes:
      - homebooks-data:/data
      - homebooks-backups:/backups

volumes:
  homebooks-data:
  homebooks-backups:
